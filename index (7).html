<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Partner Magnet AI - Lanzamiento de Red</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --royal-blue: #002366; --gold-foil: #C5A059; --white: #ffffff; }
        body { font-family: 'Montserrat', sans-serif; background: #eef2f3; margin: 0; padding: 20px; }
        .app-container { max-width: 900px; margin: auto; background: var(--white); border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); overflow: hidden; }
        .header { background: var(--royal-blue); color: var(--gold-foil); padding: 30px; text-align: center; border-bottom: 5px solid var(--gold-foil); }
        .content { padding: 40px; }
        .input-group { margin-bottom: 20px; }
        label { font-weight: 700; color: var(--royal-blue); display: block; margin-bottom: 8px; text-transform: uppercase; font-size: 0.8rem; }
        select, input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 1rem; }
        button { background: var(--royal-blue); color: var(--white); border: none; padding: 18px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1.1rem; transition: 0.4s; margin-top: 10px; }
        button:hover { background: #003aab; transform: translateY(-2px); }
        .results-area { margin-top: 30px; display: none; }
        .copy-card { background: #fdfcf0; border: 1px solid var(--gold-foil); padding: 20px; border-radius: 12px; margin-bottom: 15px; position: relative; }
        .copy-card::before { content: "🎯"; position: absolute; left: -10px; top: 10px; font-size: 20px; }
        .download-pdf { background: #27ae60; margin-top: 20px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>SISTEMA DE ATRACCIÓN MAGNÉTICA</h1>
        <p>Generador de Contenido para Partners de Éxito</p>
    </div>

    <div class="content">
        <div class="input-group">
            <label>Nombre del Partner (Ej: Norma):</label>
            <input type="text" id="partnerName" placeholder="Bienvenida...">
        </div>

        <div class="input-group">
            <label>Selecciona el Nicho Maestro:</label>
            <select id="nicheMain">
                <option value="Antienvejecimiento">Antienvejecimiento (Glutatión/Celular)</option>
                <option value="Energia">Energía y Rendimiento Mental</option>
                <option value="Inmunidad">Fortalecimiento Inmunológico</option>
                <option value="Deporte">Recuperación Deportiva Pro</option>
                <option value="Finanzas">Libertad Financiera y MLM</option>
                <option value="Mamas">Emprendimiento para Mamás</option>
                <option value="Piel">Cuidado de la Piel desde adentro</option>
                <option value="Bienestar">Bienestar Integral Senior</option>
                <option value="Desintoxicacion">Desintoxicación y Claridad</option>
                <option value="Enfoque">Productividad para Empresarios</option>
            </select>
        </div>

        <div class="input-group">
            <label>Dolor Específico (Ej: Fatiga crónica, Arrugas, Falta de tiempo):</label>
            <input type="text" id="painPoint" placeholder="¿Qué queremos resolver?">
        </div>

        <div class="input-group">
            <label>Década del Avatar:</label>
            <select id="decade">
                <option value="20">20s - Prevención y Estética</option>
                <option value="30">30s - Energía y Estrés Laboral</option>
                <option value="40">40s - Balance Hormonal y Carrera</option>
                <option value="50">50s - Vitalidad y Longevidad</option>
                <option value="60">60s - Legado y Salud Óptima</option>
            </select>
        </div>

        <button onclick="generateStrategy()">GENERAR 10 POSTS MAGNÉTICOS</button>

        <div id="results-area" class="results-area">
            <h2 id="welcomeTitle" style="color: var(--royal-blue);"></h2>
            <div id="copyList"></div>
            <button class="download-pdf" onclick="exportPDF()">DESCARGAR GUÍA DE PUBLICACIÓN (PDF)</button>
        </div>
    </div>
</div>

<script>
    function generateStrategy() {
        const name = document.getElementById('partnerName').value || "Partner";
        const niche = document.getElementById('nicheMain').value;
        const pain = document.getElementById('painPoint').value;
        const age = document.getElementById('decade').value;
        
        document.getElementById('welcomeTitle').innerText = `Plan de Contenido: ¡Bienvenida ${name}!`;
        
        const list = document.getElementById('copyList');
        list.innerHTML = "";

        const baseTitles = [
            `¿Cansada de lidiar con ${pain}? El secreto que las mujeres de ${age} están descubriendo.`,
            `Por qué ${niche} es la pieza que le faltaba a tu salud a los ${age} años.`,
            `3 señales de que tu cuerpo pide ${niche} a gritos (La #2 te sorprenderá).`,
            `Mi rutina de ${niche} para tener energía de 20 a los ${age}.`,
            `¿Suplementos o Biotecnología? La verdad sobre ${pain}.`,
            `Como mujer de ${age}, no tienes tiempo para ${pain}. Mira esto.`,
            `El protocolo de ${niche} que está cambiando la red de ${name}.`,
            `Adiós a ${pain}: El cambio celular que puedes sentir.`,
            `¿Es posible revertir el impacto de ${pain}? La ciencia dice que sí.`,
            `Únete a mi equipo: Cómo ${niche} cambió mi economía y mi salud.`
        ];

        baseTitles.forEach(t => {
            let card = document.createElement('div');
            card.className = 'copy-card';
            card.innerHTML = `<strong>POST:</strong> ${t}<br><br>
            <small style="color: #666;">📸 <strong>Idea de Imagen:</strong> Foto 8k, estilo lujoso, iluminación cálida. Mujer de ${age} años luciendo radiante y segura.</small>`;
            list.appendChild(card);
        });

        document.getElementById('results-area').style.display = "block";
    }

    function exportPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.setFontSize(18);
        doc.text("Plan Maestro de Contenido IA", 10, 20);
        doc.setFontSize(12);
        let y = 40;
        document.querySelectorAll('.copy-card').forEach((el, i) => {
            if(y > 270) { doc.addPage(); y = 20; }
            doc.text(`${i+1}. ${el.innerText.split('\n')[0]}`, 10, y);
            y += 15;
        });
        doc.save("Estrategia_Contenido.pdf");
    }
</script>
</body>
</html>
